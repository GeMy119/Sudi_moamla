<div class="max-w-[1400px] mx-auto px-4 py-10" dir="rtl">

    <div class="flex justify-between items-center mb-8">
        <h2 class="text-xl sm:text-2xl font-black text-gray-900 dark:text-white">فعاليات وإعلانات</h2>
        <button
            class="flex items-center gap-1.5 px-4 py-1.5 border border-gray-300 dark:border-gray-700 rounded-sm text-xs font-bold text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition shadow-sm">
            عرض الكل
            <svg class="w-3.5 h-3.5 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 6l6 6-6 6" />
            </svg>
        </button>
    </div>

    <div class="flex gap-5 overflow-x-auto pb-6 scrollbar-none snap-x snap-mandatory" #sliderContainer
        (scroll)="onSliderScroll(sliderContainer)">

        <div *ngFor="let event of eventsList"
            class="flex-none w-[280px] sm:w-[310px] bg-white dark:bg-gray-900 border border-gray-150 dark:border-gray-800 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between snap-start">

            <div
                class="relative w-full h-[160px] bg-gray-50 dark:bg-gray-950 flex items-center justify-center p-2 border-b border-gray-100 dark:border-gray-800">
                <img [src]="event.image || '/moi.png'" (error)="$any($event.target).src = 'assets/moi.png'"
                    [alt]="event.title"
                    [class]="event.image ? 'w-full h-full object-cover' : 'w-24 h-24 object-contain opacity-80'" />
            </div>

            <div class="p-4 flex-1 flex flex-col justify-between">
                <div>
                    <h3
                        class="text-gray-900 dark:text-white text-[14px] font-black leading-snug line-clamp-2 hover:text-[#0A6B3D] transition cursor-pointer">
                        {{ event.title }}
                    </h3>
                    <p class="text-gray-500 dark:text-gray-400 text-[12px] leading-relaxed mt-2 line-clamp-3">
                        {{ event.description }}
                    </p>
                </div>

                <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-800 flex flex-col items-center gap-3">
                    <span
                        class="text-[#0A6B3D] dark:text-green-400 bg-green-50 dark:bg-green-950/50 px-3 py-1 rounded text-[11px] font-bold tracking-wide">
                        {{ event.date }}
                    </span>
                    <button
                        class="w-full py-2 bg-[#0A6B3D] hover:bg-[#085430] text-white text-[12px] font-bold rounded-lg transition-colors shadow-sm">
                        تفاصيل الحدث
                    </button>
                </div>
            </div>

        </div>
    </div>

    <div class="flex justify-between items-center mt-6">
        <div class="flex gap-1.5 items-center flex-row-reverse">
            <span *ngFor="let dot of eventsList; let i = index"
                [class]="i === activeIndex ? 'w-2.5 h-2.5 rounded-full bg-[#0A6B3D] transition-all duration-300' : 'w-2 h-2 rounded-full bg-gray-300 dark:bg-gray-700 transition-all duration-300'">
            </span>
        </div>
        <div class="flex gap-2">
            <button (click)="scrollSlider(sliderContainer, 'next')"
                class="p-2 rounded-full bg-[#0A6B3D] hover:bg-[#085430] text-white transition shadow-sm">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </button>
            <button (click)="scrollSlider(sliderContainer, 'prev')"
                class="p-2 rounded-full border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-400 transition shadow-sm">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
            </button>

        </div>



    </div>

</div>
