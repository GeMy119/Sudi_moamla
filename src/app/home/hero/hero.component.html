<div class="relative w-full sm:text-center h-[380px] sm:h-[500px] md:h-[550px] overflow-hidden bg-gray-950 dark:bg-black"
    dir="rtl" (mouseenter)="stopAutoPlay()" (mouseleave)="startAutoPlay()">

    <div *ngFor="let slide of slides; let i = index">
        <div *ngIf="i === currentIndex"
            class="absolute inset-0 z-0 flex items-center transition-opacity duration-500 ease-in-out">

            <img [src]="slide.image" [alt]="slide.title"
                class="absolute inset-0 w-full h-full object-cover object-center z-0 opacity-100 dark:opacity-80 transition-opacity duration-300">

            <div
                class="absolute inset-0 bg-gradient-to-l from-black/80 via-emerald-950/70 to-black/30 dark:from-black/95 dark:via-emerald-950/60 dark:to-black/50 mix-blend-multiply z-10">
            </div>

            <div
                class="relative z-20 w-full max-w-7xl mx-auto px-6 sm:px-16 md:px-24 flex justify-start items-center sm:text-center">
                <div class="text-right max-w-xl space-y-2 sm:space-y-3">
                    <h1
                        class="text-white dark:text-gray-100 font-black text-3xl sm:text-4xl md:text-5xl leading-tight tracking-wide drop-shadow-lg sm:text-center">
                        {{ slide.title }}
                    </h1>
                    <p
                        class="text-gray-200 dark:text-gray-300 font-medium text-sm sm:text-base md:text-lg opacity-90 pr-1 drop-shadow-md sm:text-center">
                        {{ slide.subtitle }}
                    </p>
                </div>
            </div>

        </div>
    </div>

    <div class="absolute bottom-5 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2">
        <button *ngFor="let slide of slides; let i = index" (click)="setSlide(i)"
            [class]="i === currentIndex 
        ? 'w-3 h-3 sm:w-3.5 sm:h-3.5 rounded-full bg-emerald-500 dark:bg-green-500 shadow-[0_0_8px_rgba(16,185,129,0.6)] dark:shadow-[0_0_10px_rgba(34,197,94,0.5)] scale-110 transition-all duration-200' 
        : 'w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-white/40 dark:bg-white/20 hover:bg-white dark:hover:bg-white/70 transition-all duration-200'">
        </button>
    </div>
</div>
