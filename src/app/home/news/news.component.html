<div class="max-w-[1400px] mx-auto px-4 py-8">

    <!-- هيدر القسم: العنوان وزر عرض الكل -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl sm:text-2xl font-black text-gray-900 dark:text-white">آخر الأخبار</h2>
        <button
            class="flex items-center gap-1.5 px-4 py-1.5 border border-gray-300 dark:border-gray-700 rounded-sm text-xs font-bold text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-850 transition shadow-sm">
            عرض الكل
            <svg class="w-3.5 h-3.5 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 6l6 6-6 6" />
            </svg>
        </button>
    </div>

    <!-- الشبكة التقسيمية (Grid Layout) المطابقة للصورة تماماً -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

        <!-- [اليمين]: الخبر الرئيسي الكبير (يأخذ 6 أعمدة من أصل 12) -->
        <div *ngIf="mainNews"
            class="lg:col-span-6 relative group rounded-xl overflow-hidden shadow-md bg-gray-900 aspect-[4/3] lg:aspect-auto lg:min-h-[350px]">
            <!-- الصورة الأساسية مع معالجة الخطأ في التحميل -->
            <img [src]="mainNews.image || '/moi.png'" (error)="$any($event.target).src = '/default-logo.png'"
                [alt]="mainNews.title"
                class="w-full h-full object-cover transition duration-500 group-hover:scale-105" />

            <!-- التدرج الظلي الأسفل لحماية وضوح النص -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>

            <!-- تفاصيل الخبر المتموضعة في الأسفل -->
            <div class="absolute bottom-0 right-0 left-0 p-5 sm:p-8 flex flex-col items-start gap-2">
                <h3
                    class="text-white text-base sm:text-xl font-bold leading-snug tracking-wide group-hover:text-green-400 transition">
                    {{ mainNews.title }}
                </h3>
                <span class="text-gray-300 text-[11px] font-medium font-mono">
                    {{ mainNews.date }}
                </span>
            </div>
        </div>

        <!-- [اليسار]: شبكة الأخبار الأربعة الصغيرة (تأخذ 6 أعمدة وتقسم لعمودين وبداخلها كروت) -->
        <div class="lg:col-span-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div *ngFor="let item of subNews"
                class="relative group rounded-xl overflow-hidden shadow-md bg-gray-900 aspect-[4/3.5]">

                <!-- صورة الخبر الصغير مع تفعيل الصورة البديلة في حال عدم وجودها -->
                <img [src]="item.image || '/moi.png'" (error)="$any($event.target).src = '/default-logo.png'"
                    [alt]="item.title"
                    class="w-full h-full object-cover transition duration-500 group-hover:scale-105" />

                <!-- الطبقة المظلمة السفلية لقراءة النص -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/30 to-transparent"></div>

                <!-- تفاصيل الخبر الصغير -->
                <div class="absolute inset-0 p-4 flex flex-col justify-end items-start gap-1">
                    <h3
                        class="text-white text-xs sm:text-[13.5px] font-bold leading-relaxed group-hover:text-green-400 transition line-clamp-3">
                        {{ item.title }}
                    </h3>
                    <span class="text-gray-400 text-[10px] font-medium font-mono mt-1">
                        {{ item.date }}
                    </span>

                    <!-- سهم الانتقال الصغير الموضح باللون الأخضر في بعض كروت الصورة -->
                    <div *ngIf="item.hasLink"
                        class="absolute bottom-3 left-3 bg-[#0A6B3D] text-white p-1.5 rounded-md opacity-90 group-hover:opacity-100 transition shadow">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>
